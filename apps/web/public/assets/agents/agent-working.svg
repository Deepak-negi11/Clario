<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" class="working"><defs><linearGradient id="clay" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e99875"/><stop offset=".55" stop-color="#d67b58"/><stop offset="1" stop-color="#bf5c3e"/></linearGradient><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d4d50"/><stop offset="1" stop-color="#162629"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#667b7c"/><stop offset="1" stop-color="#33494b"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fefefd"/><stop offset="1" stop-color="#dcdfe0"/></linearGradient></defs><style>@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}.float{animation:hover 3.4s ease-in-out infinite;transform-origin:48px 46px}.eyes{animation:blink 5.4s linear infinite;transform-origin:48px 42px}.working .float{animation-duration:1.8s}.working .left{animation:tap .5s ease-in-out infinite}.working .right{animation:tap .5s ease-in-out -.25s infinite}.working .cursor{animation:blink 1.3s steps(1) infinite;transform-origin:64px 50px}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="48" cy="80" rx="29" ry="4" fill="#29322e" opacity=".1"/><g class="float"><rect x="18" y="22" width="60" height="45" rx="14" fill="url(#glass)" stroke="#a9b6b0"/><path d="m36 37-8 8 8 8m24-16 8 8-8 8" fill="none" stroke="#5c756c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="m51 36-6 18" stroke="#5c756c" stroke-width="3" stroke-linecap="round"/></g></svg>
